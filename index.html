      <div className="form-group">
        <label className="form-label">Асуултын төрөл</label>
        <div className="ai-gen-types">
          {allowedTypes.map(t => (
            <button key={t.id} type="button" className={'ai-type-chip' + (qType === t.id ? ' selected' : '')}
              onClick={() => setQType(t.id)}>{t.label}</button>
          ))}
        </div>
      </div>
      <div className="form-row">
        <div className="form-group">
          <label className="form-label">Сэдэв</label>
          <input className="form-input" placeholder="жн: Ионы холбоо, Simple Past..." value={topic}
            onChange={e => setTopic(e.target.value)} />
        </div>
        <div className="form-group">
          <label className="form-label">Тоо</label>
          <input className="form-input" type="number" min="1" max="20" value={count}
            onChange={e => setCount(e.target.value)} />
        </div>
      </div>
      {err && <div className="form-error" style={{marginBottom:10}}>⚠ {err}</div>}
      {busy ? (
        <div className="parsing-overlay">
          <div className="spinner"></div>
          <div style={{fontFamily:'Outfit',fontWeight:700}}>AI асуулт үүсгэж байна...</div>
        </div>
      ) : (
        <div style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          {onBack && <button className="btn btn-outline" onClick={onBack}>← Буцах</button>}
          <button className="btn btn-violet btn-lg" onClick={doGenerate} disabled={!topic.trim()}>
            ✨ Асуулт үүсгэх
          </button>
        </div>
      )}
      {preview && (
        <div className="ai-success-banner">
          ✅ {preview.length} асуулт амжилттай үүслээ — доор хянана уу
        </div>
      )}
    </div>
  );
}

// ─── QUESTION EDITOR ──────────────────────────────────────────────────────────
function QuestionEditor({ questions, onChange, defaultType = 'mcq', subjectFeatures = [] }) {
  const setQ = (idx, field, val) => {
    const next = questions.map((q, i) => i === idx ? {...q, [field]: val} : q);
    onChange(next);
  };
  const setOpt = (qi, oi, val) => {
    const next = questions.map((q, i) => {
      if (i !== qi) return q;
      const opts = (q.options || []).map((o, j) => j === oi ? {...o, text: val} : o);
      return {...q, options: opts};
    });
    onChange(next);
  };
  const changeType = (qi, type) => {
    const next = questions.map((q, i) => {
      if (i !== qi) return q;
      return {
        ...q,
        type,
        options: defaultOptionsForType(type),
        answer: null,
        numericAnswer: type === 'grid' ? (q.numericAnswer || '') : null
      };
    });
    onChange(next);
  };
  const addQ = () => {
    onChange([...questions, {
      ...seedQuestion(defaultType),
      id: questions.length + 1
    }]);
  };
  const removeQ = idx => onChange(questions.filter((_, i) => i !== idx).map((q, i) => ({...q, id: i + 1})));

  return (
    <div>
      {questions.map((q, qi) => {
        const type = q.type || defaultType || 'mcq';
        return (
          <div className="question-item" key={qi} style={{marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8,gap:8,flexWrap:'wrap'}}>
              <span className="q-num">#{q.id}</span>
              <select className="form-select" style={{width:'auto',padding:'4px 10px',fontSize:'0.8rem'}}
                value={type} onChange={e => changeType(qi, e.target.value)}>
                <option value="mcq">A–D сонголт</option>
                <option value="tf">Зөв / Буруу</option>
                <option value="grid">Grid-in (тоон)</option>
                <option value="blank">Сул орон</option>
              </select>
              <button className="btn btn-red btn-sm" onClick={() => removeQ(qi)}>✕ Устгах</button>
            </div>
            {(subjectFeatures.includes('source') || type === 'tf') && (
              <div className="form-group">
                <label className="form-label">Эх текст / Сурвалж</label>
                <textarea className="form-textarea" style={{minHeight:60,fontSize:'0.85rem'}}
                  placeholder="Эх текст..." value={q.sourceText || ''} onChange={e => setQ(qi, 'sourceText', e.target.value)} />
              </div>
            )}
            {subjectFeatures.includes('image') && (
              <div className="form-group">
                <label className="form-label">Зураг URL (сонголттой)</label>
                <input className="form-input" placeholder="https://..." value={q.imageUrl || ''}
                  onChange={e => setQ(qi, 'imageUrl', e.target.value)} />
              </div>
            )}
            {subjectFeatures.includes('audio') && (
              <div className="form-group">
                <label className="form-label">Аудио URL (сонсгол)</label>
                <input className="form-input" placeholder="https://...mp3" value={q.audioUrl || ''}
                  onChange={e => setQ(qi, 'audioUrl', e.target.value)} />
              </div>
            )}
            <div className="form-row" style={{marginBottom:8}}>
              <div className="form-group" style={{marginBottom:0}}>
                <label className="form-label">Сэдэв (анализд)</label>
                <input className="form-input" placeholder="жн: Ионы холбоо" value={q.topic || ''}
                  onChange={e => setQ(qi, 'topic', e.target.value)} />
              </div>
              {subjectFeatures.includes('unit') && (
                <div className="form-group" style={{marginBottom:0}}>
                  <label className="form-label">Нэгж</label>
                  <input className="form-input" placeholder="жн: N, m/s²" value={q.unit || ''}
                    onChange={e => setQ(qi, 'unit', e.target.value)} />
                </div>
              )}
            </div>
            <textarea className="form-textarea" style={{minHeight:60,fontSize:'0.875rem',marginBottom:10}}
              placeholder="Асуултын текст..." value={q.text} onChange={e => setQ(qi, 'text', e.target.value)} />

            {type === 'grid' ? (
              <div style={{marginBottom:10}}>
                <label className="form-label">Зөв хариу (3 оронтой тоо)</label>
                <input className="form-input" style={{maxWidth:160}} maxLength={3} placeholder="115"
                  value={q.numericAnswer || q.answer || ''}
                  onChange={e => {
                    const v = e.target.value.replace(/\D/g, '').slice(0, 3);
                    const next = questions.map((qq, i) => i === qi ? {...qq, numericAnswer: v, answer: v} : qq);
                    onChange(next);
                  }} />
                {q.unit && <span style={{marginLeft:8,color:'var(--text2)',fontWeight:600}}>{q.unit}</span>}
              </div>
            ) : (
              <>
                <div className="options-grid" style={{marginBottom:10}}>
                  {(q.options || []).map((opt, oi) => (
                    <div key={opt.key} style={{display:'flex',gap:7,alignItems:'center'}}>
                      <div className="option-key" style={{
                        background: q.answer===opt.key ? 'var(--green)' : undefined,
                        color: q.answer===opt.key ? 'white' : undefined,
                        border: q.answer===opt.key ? '1.5px solid var(--green)' : undefined
                      }}>{opt.key}</div>
                      <input className="form-input" style={{flex:1,padding:'6px 10px',fontSize:'0.82rem'}}
                        placeholder={opt.key + ' хариулт...'} value={opt.text}
                        onChange={e => setOpt(qi, oi, e.target.value)} />
                    </div>
                  ))}
                </div>
                <div className="answer-select-row">
                  <span className="answer-label">Зөв хариулт:</span>
                  {(q.options || []).map(opt => (
                    <button key={opt.key} className={'ans-btn' + (q.answer === opt.key ? ' selected' : '')}
                      onClick={() => setQ(qi, 'answer', q.answer === opt.key ? null : opt.key)}>{opt.key}</button>
                  ))}
                </div>
              </>
            )}
          </div>
        );
      })}
      <button className="btn btn-outline" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={addQ}>
        + Асуулт нэмэх
      </button>
    </div>
  );
}

// ─── CREATE EXAM (3-step wizard) ──────────────────────────────────────────────
function CreateExam({ apiKey, onApiKey, onSave, onCancel }) {
  const [step, setStep] = useState(1);
  const [info, setInfo] = useState({
    title: '', subject: '', subjectId: '', duration: 45, passingScore: 60,
    omrFormat: 'mcq', omrMode: 'mcq'
  });
  const [variants, setVariants] = useState([{ label: 'A', questions: [] }]);
  const [activeVar, setActiveVar] = useState(0);
  const [saving, setSaving] = useState(false);
  const [step3Mode, setStep3Mode] = useState('ai');
  const [showInlineAI, setShowInlineAI] = useState(false);
  const [inlineRaw, setInlineRaw] = useState('');
  const [inlineParsing, setInlineParsing] = useState(false);
  const [inlineErr, setInlineErr] = useState('');
  const [showApiModal, setShowApiModal] = useState(false);
  const [localApiKey, setLocalApiKey] = useState(apiKey || '');
  const variantCount = variants.length;
  const profile = getSubjectProfile(info.subjectId || info.subject);
  const stepLabels = ['Хичээл сонгох', 'Format & template', 'Асуулт үүсгэх'];
  const effectiveKey = localApiKey || apiKey || '';

  useEffect(() => { setLocalApiKey(apiKey || ''); }, [apiKey]);

  const saveApiKey = (k) => {
    setLocalApiKey(k);
    onApiKey?.(k);
  };
  const needApiKey = () => setShowApiModal(true);

  const selectSubject = (p) => {
    setInfo(prev => ({
      ...prev,
      subject: p.name,
      subjectId: p.id,
      omrFormat: p.formats[0]?.id || 'mcq',
      omrMode: p.omrMode || 'mcq'
    }));
  };

  const handleParsed = qs => {
    setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v));
    setStep3Mode('manual');
  };

  const handleGenerated = qs => {
    setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v));
    setStep3Mode('manual');
  };

  const handleManual = () => {
    const type = info.omrFormat === 'tf' ? 'tf' : info.omrFormat === 'grid' ? 'grid' : 'mcq';
    setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: [seedQuestion(type)]}) : v));
    setStep3Mode('manual');
  };

  const addVariant = () => {
    // Keep current variant (A) questions; append empty B/C/... and open same entry flow
    if (variants.length >= 5) return;
    const nextIdx = variants.length;
    setVariants(prev => {
      if (prev.length >= 5) return prev;
      return [...prev, { label: alpha(prev.length), questions: [] }];
    });
    setActiveVar(nextIdx);
    setStep3Mode('ai');
    setShowInlineAI(false);
    setInlineRaw('');
    setInlineErr('');
  };

  const goNextVariant = () => addVariant();

  const selectVariantTab = (idx) => {
    setActiveVar(idx);
    const qs = variants[idx]?.questions || [];
    const hasQs = qs.some(q => (q.text || '').trim());
    setStep3Mode(hasQs ? 'manual' : 'ai');
    setShowInlineAI(false);
    setInlineRaw('');
    setInlineErr('');
  };

  const doInlineParse = async () => {
    if (!inlineRaw.trim()) return;
    if (!effectiveKey) { needApiKey(); return; }
    setInlineParsing(true); setInlineErr('');
    try {
      const qs = await parseTestWithAI(inlineRaw, effectiveKey);
      if (!Array.isArray(qs) || !qs.length) throw new Error('Асуулт илрэхгүй');
      setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v));
      setShowInlineAI(false); setInlineRaw('');
    } catch (e) {
      setInlineErr(e?.message || 'Алдаа');
    } finally {
      setInlineParsing(false);
    }
  };

  const handlePublish = () => {
    const hasAny = variants.some(v => (v.questions || []).some(q => (q.text || '').trim()));
    if (!hasAny) { alert('Дор хаяж нэг асуулт оруулна уу'); return; }
    if (!info.title.trim()) { alert('Шалгалтын нэр оруулна уу'); return; }
    setSaving(true);
    setTimeout(async () => {
      try {
        const teacher = ensureTeacherAuth();
        if (!teacher) {
          alert('Нэвтэрсэн багш олдсонгүй. Дахин нэвтэрнэ үү.');
          setSaving(false);
          return;
        }
        const normalizedVariants = variants.map((v, vidx) => {
          const valid = (v.questions || []).filter(q => (q.text || '').trim());
          return { label: v.label || alpha(vidx), questions: valid.map((q, i) => ({...q, id: i + 1})) };
        }).filter(v => v.questions.length > 0);
        const examId = uid();
        const exam = {
          id: examId,
          title: sanitizeText(info.title, 200),
          subject: sanitizeText(info.subject, 100),
          subjectId: info.subjectId,
          duration: info.duration,
          passingScore: info.passingScore,
          omrFormat: info.omrFormat,
          omrMode: info.omrMode || profile?.omrMode || 'mcq',
          ownerUid: teacher.uid,
          variants: normalizedVariants.length ? normalizedVariants : [{ label: 'A', questions: [] }],
          createdAt: new Date().toISOString(),
          published: true,
          submissionCount: 0
        };
        const db = getDb();
        if (db) {
          const versions = {};
          const answerKeys = {};
          exam.variants.forEach((v) => {
            versions[v.label] = packQuestions(v.questions);
            answerKeys[v.label] = packAnswerKeys(v.questions);
          });
          await roomRef(db, exam.id).set({
            roomID: exam.id,
            title: exam.title,
            subject: exam.subject,
            subjectId: exam.subjectId,
            duration: exam.duration,
            passingScore: exam.passingScore,
            omrFormat: exam.omrFormat,
            omrMode: exam.omrMode,
            ownerUid: teacher.uid,
            publicReadable: true,
            createdAt: exam.createdAt,
            versions,
            answerKeys,
            clientPack: buildClientPack({ ...exam, ownerUid: teacher.uid }, versions)
          });
        }
        onSave(exam);
      } catch (e) {
        alert('Нийтлэхэд алдаа: ' + (e?.message || e) + '\n\nFirebase Auth нэвтэрсэн эсэх болон database rules deploy хийсэн эсэхийг шалгана уу.');
        setSaving(false);
      }
    }, 100);
  };

  const currentVariant = variants[activeVar] || { label: alpha(activeVar), questions: [] };
  const currentQCount = (currentVariant.questions || []).filter(q => q.text).length;
  const totalQCount = variants.reduce((sum, v) => sum + (v.questions||[]).filter(q=>q.text).length, 0);
  const formats = profile?.formats || [{ id: 'mcq', label: 'A–D Multiple Choice', desc: 'Standard format' }];

  return (
    <div>
      {showApiModal && (
        <SettingsModal
          apiKey={effectiveKey}
          title="🔑 Groq API түлхүүр"
          onSave={saveApiKey}
          onClose={() => setShowApiModal(false)}
        />
      )}
      <div className="page-header">
        <h2 className="page-title">✏ Шалгалт үүсгэх</h2>
        <div className="page-sub">3 алхамт мастер · хичээлийн тусгай OMR формат</div>
      </div>

      <div className="steps mb-4">
        {stepLabels.map((lbl, i) => (
          <React.Fragment key={i}>
            <div className={'step' + (step === i+1 ? ' active' : step > i+1 ? ' done' : '')}>
              <div className="step-num">{step > i+1 ? '✓' : i+1}</div>
              <span>{lbl}</span>
            </div>
            {i < stepLabels.length - 1 && <div className="step-line" />}
          </React.Fragment>
        ))}
      </div>

      <div className="card">
        <div className="card-body">
          {step === 1 && (
            <div>
              <label className="form-label" style={{marginBottom:12}}>Хичээл сонгох</label>
              <div className="subject-grid">
                {SUBJECT_PROFILES.map(p => (
                  <button key={p.id} type="button"
                    className={'subject-card' + (info.subjectId === p.id ? ' selected' : '')}
                    style={{ '--subject-color': p.color }}
                    onClick={() => selectSubject(p)}>
                    <div className="subject-card-icon">{p.icon}</div>
                    {p.name}
                    <div className="subject-card-fmt">{p.formats[0]?.label}</div>
                  </button>
                ))}
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Шалгалтын нэр</label>
                  <input className="form-input" placeholder="жн: Ионы холбоо — Улирлын шалгалт"
                    value={info.title} onChange={e => setInfo(p => ({...p, title: e.target.value}))} />
                </div>
                <div className="form-group">
                  <label className="form-label">Хугацаа (мин)</label>
                  <input className="form-input" type="number" min="5" max="180" value={info.duration}
                    onChange={e => setInfo(p => ({...p, duration: +e.target.value}))} />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Тэнцэх босго (%)</label>
                <input className="form-input" type="number" min="0" max="100" style={{maxWidth:160}}
                  value={info.passingScore}
                  onChange={e => setInfo(p => ({...p, passingScore: +e.target.value}))} />
              </div>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:8}}>
                <button className="btn btn-outline" onClick={onCancel}>Болих</button>
                <button className="btn btn-primary" onClick={() => setStep(2)}
                  disabled={!info.subjectId || !info.title.trim()}>Дараах →</button>
              </div>
            </div>
          )}

          {step === 2 && (
            <div>
              <div style={{marginBottom:16,display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:'1.5rem'}}>{profile?.icon}</span>
                <div>
                  <div style={{fontFamily:'Outfit',fontWeight:800}}>{info.subject}</div>
                  <div style={{fontSize:'0.8rem',color:'var(--text2)'}}>OMR template and test format</div>
                </div>
              </div>
              <label className="form-label">Select format</label>
              <div className="format-grid">
                {formats.map(f => (
                  <button key={f.id} type="button"
                    className={'format-card' + (info.omrFormat === f.id ? ' selected' : '')}
                    onClick={() => setInfo(p => ({
                      ...p,
                      omrFormat: f.id,
                      omrMode: f.id === 'tf' ? 'tf' : f.id === 'grid' ? 'grid' : (profile?.omrMode || 'mcq')
                    }))}>
                    <div className="format-card-title">{f.label}</div>
                    <div className="format-card-desc">{f.desc}</div>
                  </button>
                ))}
              </div>
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <button className="btn btn-outline" onClick={() => setStep(1)}>← Back</button>
                <button className="btn btn-primary" onClick={() => setStep(3)}>Next →</button>
              </div>
            </div>
          )}

          {step === 3 && (
            <div>
              <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
                {[
                  ['ai', '🤖 AI үүсгэх'],
                  ['parse', '✨ Текст задлах'],
                  ['manual', '✏ Гараар / Хянах']
                ].map(([id, lbl]) => (
                  <button key={id} className={'btn btn-sm' + (step3Mode === id ? ' btn-violet' : ' btn-outline')}
                    onClick={() => setStep3Mode(id)}>{lbl}</button>
                ))}
              </div>

              {step3Mode === 'ai' && (
                <AIQuestionGenerator
                  apiKey={effectiveKey}
                  subject={info.subject}
                  format={info.omrFormat}
                  onGenerated={handleGenerated}
                  onBack={() => setStep(2)}
                  onNeedApiKey={needApiKey}
                />
              )}

              {step3Mode === 'parse' && (
                <AIParseStep
                  apiKey={effectiveKey}
                  onParsed={handleParsed}
                  onManual={handleManual}
                  onBack={() => setStep(2)}
                  variantCount={variantCount}
                  onVariantCountChange={addVariant}
                  currentVariantLabel={currentVariant.label || alpha(activeVar)}
                  onNeedApiKey={needApiKey}
                />
              )}

              {step3Mode === 'manual' && (
                <div>
                  <div className="version-indicator">
                    <div className="version-indicator-icon">{currentVariant.label || alpha(activeVar)}</div>
                    <div className="version-indicator-text">
                      <div className="version-indicator-label">Хувилбар {currentVariant.label || alpha(activeVar)}</div>
                      <div className="version-indicator-sub">
                        {currentQCount} асуулт · Нийт {totalQCount} · {info.subject} · {info.omrFormat}
                      </div>
                    </div>
                    <div style={{display:'flex',gap:8}}>
                      <button className="btn btn-outline btn-sm" onClick={() => {
                        if (!effectiveKey) { needApiKey(); return; }
                        setShowInlineAI(s => !s);
                      }}>✨ AI</button>
                      {variantCount < 5 && (
                        <button className="btn btn-sm" style={{background:'var(--violet)',color:'white'}} onClick={goNextVariant}>
                          ➕ Хувилбар
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="version-tab-strip">
                    {variants.map((v, idx) => (
                      <button key={idx} className={'version-tab' + (idx === activeVar ? ' active' : '')}
                        onClick={() => selectVariantTab(idx)}>
                        {v.label || alpha(idx)}
                        <span className="vtab-count">{(v.questions||[]).filter(q=>q.text).length}</span>
                      </button>
                    ))}
                    <div style={{marginLeft:'auto',display:'flex',gap:8}}>
                      <button className="btn btn-outline btn-sm" onClick={() => setStep(2)}>← Формат</button>
                      <button className="btn btn-green btn-sm" onClick={handlePublish} disabled={saving}>
                        {saving ? '⏳ ...' : '🚀 Нийтлэх'}
                      </button>
                    </div>
                  </div>

                  {showInlineAI && (
                    <div className="inline-ai-panel">
                      {inlineParsing ? (
                        <div style={{textAlign:'center',padding:24}}><div className="spinner" /></div>
                      ) : (
                        <>
                          <textarea className="form-textarea" style={{minHeight:120,fontFamily:'monospace',fontSize:'0.82rem'}}
                            value={inlineRaw} onChange={e => setInlineRaw(e.target.value)}
                            placeholder="Текст paste..." />
                          {inlineErr && <div className="form-error">{inlineErr}</div>}
                          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
                            <button className="btn btn-outline btn-sm" onClick={() => setShowInlineAI(false)}>Болих</button>
                            <button className="btn btn-violet btn-sm" onClick={doInlineParse}>✨ Задлах</button>
                          </div>
                        </>
                      )}
                    </div>
                  )}

                  {!(currentVariant.questions || []).length && (
                    <div style={{marginBottom:12}}>
                      <button className="btn btn-outline" onClick={handleManual}>+ Хоосон асуулт нэмэх</button>
                    </div>
                  )}

                  <QuestionEditor
                    questions={currentVariant.questions || []}
                    defaultType={info.omrFormat === 'tf' ? 'tf' : info.omrFormat === 'grid' ? 'grid' : 'mcq'}
                    subjectFeatures={profile?.features || []}
                    onChange={(qs) => setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v))}
                  />
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


// ─── QR MODAL ─────────────────────────────────────────────────────────────────
function QRModal({ exam, onClose }) {
  const [step, setStep] = useState('confirm'); // confirm | addClass | qr
  const [classInput, setClassInput] = useState('');
  const [activeClassKey, setActiveClassKey] = useState('');
  const [classList, setClassList] = useState([]); // [{key,name}]
  const [savingClass, setSavingClass] = useState(false);
  const qrRef = useRef(null);
  const [joins, setJoins] = useState([]);
  const [variantCounts, setVariantCounts] = useState(null);
  const channelRef = useRef(null);
  const variantLabels = useMemo(() => getExamVariantLabels(exam), [exam]);
  const activeClassName = useMemo(() => {
    const hit = classList.find(c => c.key === activeClassKey);
    return hit?.name || displayClassName(activeClassKey, activeClassKey);
  }, [classList, activeClassKey]);

  const matchClass = useCallback((payload) => {
    if (!activeClassKey) return true;
    if (payload?.classKey) return payload.classKey === activeClassKey;
    const clsRaw = typeof payload === 'string' ? payload : (payload?.cls || '');
    const k = normalizeClassKey(clsRaw);
    return k === activeClassKey || (clsRaw || '').trim() === activeClassName;
  }, [activeClassKey, activeClassName]);

  const addJoin = useCallback((payload, id) => {
    if (!payload?.name || !matchClass(payload)) return;
    setJoins(prev => {
      const key = id || (payload.name + '|' + (payload.cls || '') + '|' + (payload.at || ''));
      if (prev.some(p => p.id === key)) return prev;
      return [{ id: key, name: payload.name, cls: payload.cls || activeClassName, at: payload.at || Date.now() }, ...prev].slice(0, 30);
    });
  }, [matchClass, activeClassName]);

  // Firebase: бүртгэлтэй ангиуд + сүүлийн ангиар шууд QR
  useEffect(() => {
    if (!exam?.id) return;
    const db = getDb();
    // Backfill clientPack so QR students load in 1 RTDB read
    try {
      const teacher = ensureTeacherAuth();
      if (db && teacher) {
        const versions = {};
        normalizeVariants(exam).forEach(v => {
          const qs = (v.questions || []).filter(q => (q.text || '').trim());
          if (qs.length) versions[v.label || 'A'] = packQuestions(qs);
        });
        if (Object.keys(versions).length) {
          roomRef(db, exam.id).child('clientPack')
            .set(buildClientPack({ ...exam, ownerUid: teacher.uid, id: exam.id }, versions))
            .catch(() => {});
        }
      }
    } catch {}
    const lastKey = (() => { try { return localStorage.getItem(lastQrClassStorageKey(exam.id)); } catch { return ''; } })();
    if (!db) {
      if (lastKey) {
        setActiveClassKey(lastKey);
        setClassList([{ key: lastKey, name: displayClassName(lastKey, lastKey) }]);
        setStep('qr');
      }
      return;
    }
    const ref = roomRef(db, exam.id).child('classes');
    const handler = ref.on('value', snap => {
      const val = snap.val() || {};
      const list = Object.entries(val).map(([key, v]) => ({
        key,
        name: (v && v.name) ? v.name : key
      })).sort((a, b) => a.name.localeCompare(b.name, 'mn'));
      setClassList(list);
      const pick = (lastKey && list.some(c => c.key === lastKey)) ? lastKey : (list[0]?.key || '');
      if (pick) {
        setActiveClassKey(pick);
        setStep('qr');
      }
    });
    return () => { try { ref.off('value', handler); } catch {} };
  }, [exam?.id]);

  const goQrForClass = useCallback(async (name) => {
    setSavingClass(true);
    try {
      const reg = await registerExamClass(exam.id, name);
      setActiveClassKey(reg.key);
      setClassInput('');
      setStep('qr');
    } catch (e) {
      alert(e.message || 'Алдаа');
    } finally {
      setSavingClass(false);
    }
  }, [exam?.id]);

  useEffect(() => {
    if (!exam?.id || !activeClassKey) return;
    try {
      const bc = new BroadcastChannel('se_join_' + exam.id + '_' + activeClassKey);
      channelRef.current = bc;
      bc.onmessage = (ev) => {
        if (ev?.data?.type === 'JOIN') addJoin(ev.data.payload, ev.data.payload?.id);
      };
      return () => { try { bc.close(); } catch {} };
    } catch {}
  }, [exam?.id, activeClassKey, addJoin]);

  useEffect(() => {
    if (!exam?.id || !activeClassKey) return;
    const db = getDb();
    if (!db) return;
    setJoins([]);
    try {
      const ref = roomRef(db, exam.id).child('joins').limitToLast(80);
      const onAdd = ref.on('child_added', snap => addJoin(snap.val(), snap.key));
      return () => { try { ref.off('child_added', onAdd); } catch {} };
    } catch {}
  }, [exam?.id, activeClassKey, addJoin]);

  useEffect(() => {
    if (!exam?.id || !activeClassKey || variantLabels.length < 2) { setVariantCounts(null); return; }
    const db = getDb();
    if (!db) return;
    try {
      const ref = roomRef(db, exam.id).child('variantAllocator').child(activeClassKey).child('counts');
      const handler = ref.on('value', snap => setVariantCounts(snap.val() || {}));
      return () => { try { ref.off('value', handler); } catch {} };
    } catch {}
  }, [exam?.id, activeClassKey, variantLabels.length]);

  useEffect(() => {
    if (step !== 'qr' || !qrRef.current || !activeClassKey) return;
    qrRef.current.innerHTML = '';
    try {
      const base = window.location.origin + window.location.pathname;
      const packed = packExamForQR(exam, activeClassKey);
      const data = LZString.compressToEncodedURIComponent(JSON.stringify(packed));
      const url = base + '#qr=' + data;
      new QRCode(qrRef.current, {
        text: url,
        width: 240, height: 240,
        colorDark: '#1e293b', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.L
      });
    } catch(e) { qrRef.current.innerHTML = '<div style="color:red">QR үүсгэхэд алдаа гарлаа</div>'; }
  }, [step, activeClassKey, exam?.id]);

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{maxWidth:480}}>
        {step === 'confirm' ? (
          <>
            <div className="modal-head">
              <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>📱 QR код үүсгэх</div>
            </div>
            <div className="modal-body">
              <div style={{fontSize:'0.95rem',marginBottom:12}}>
                <strong>"{exam.title}"</strong> шалгалтын QR кодыг үүсгэх үү?
              </div>
              <div style={{fontSize:'0.85rem',color:'var(--text2)',lineHeight:1.7,marginBottom:16}}>
                Сурагчид QR уншуулахад зөвхөн <strong>нэр</strong> бичнэ.<br/>
                Ангиа багш энд томилно.
              </div>
              <div className="form-group">
                <label className="form-label">Ангийн нэр</label>
                <input
                  className="form-input"
                  placeholder="жн: 7а, 8б, 9а"
                  value={classInput}
                  onChange={e => setClassInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && classInput.trim() && goQrForClass(classInput)}
                  autoFocus
                />
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={onClose}>Болих</button>
              <button
                className="btn btn-primary"
                disabled={!classInput.trim() || savingClass}
                onClick={() => goQrForClass(classInput)}
              >
                {savingClass ? '⏳ ...' : '✓ Тийм, үүсгэх'}
              </button>
            </div>
          </>
        ) : step === 'addClass' ? (
          <>
            <div className="modal-head">
              <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>➕ Өөр анги</div>
            </div>
            <div className="modal-body">
              <div style={{fontSize:'0.85rem',color:'var(--text2)',marginBottom:14,lineHeight:1.6}}>
                Ижил шалгалтын материалаар өөр ангид QR үүсгэнэ (жн: 9а).
              </div>
              <div className="form-group">
                <label className="form-label">Ангийн нэр</label>
                <input
                  className="form-input"
                  placeholder="жн: 9а"
                  value={classInput}
                  onChange={e => setClassInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && classInput.trim() && goQrForClass(classInput)}
                  autoFocus
                />
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={() => { setClassInput(''); setStep(activeClassKey ? 'qr' : 'confirm'); }}>Болих</button>
              <button className="btn btn-primary" disabled={!classInput.trim() || savingClass} onClick={() => goQrForClass(classInput)}>
                ✓ QR үүсгэх
              </button>
            </div>
          </>
        ) : (
          <>
            <div className="modal-head" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
              <div>
                <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>📱 {exam.title}</div>
                <div style={{fontSize:'0.8rem',color:'var(--text2)',marginTop:4}}>
                  <span style={{background:'var(--violet-light)',color:'var(--violet)',padding:'3px 10px',borderRadius:20,fontWeight:800}}>
                    {activeClassName} анги
                  </span>
                  {' '}· Сурагч зөвхөн нэрээ бичнэ
                </div>
              </div>
              <button className="btn btn-outline btn-sm" style={{flexShrink:0}} onClick={() => { setClassInput(''); setStep('addClass'); }}>
                Өөр анги
              </button>
            </div>
            <div className="modal-body" style={{textAlign:'center',padding:'28px 24px'}}>
              <div className="qr-wrap" style={{marginBottom:16}}>
                <div ref={qrRef} />
              </div>

              {classList.length > 1 && (
                <div style={{display:'flex',flexWrap:'wrap',gap:6,justifyContent:'center',marginBottom:12}}>
                  {classList.map(c => (
                    <button
                      key={c.key}
                      type="button"
                      className={`btn btn-sm ${c.key === activeClassKey ? 'btn-violet' : 'btn-outline'}`}
                      onClick={() => {
                        setActiveClassKey(c.key);
                        try { localStorage.setItem(lastQrClassStorageKey(exam.id), c.key); } catch {}
                        setJoins([]);
                      }}
                    >
                      {c.name}
                    </button>
                  ))}
                </div>
              )}

              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,margin:'0 auto 10px',maxWidth:360}}>
                <div style={{fontSize:'0.82rem',color:'var(--text2)',textAlign:'left'}}>
                  👥 {activeClassName} орсон: <strong style={{color:'var(--text)'}}>{joins.length}</strong>
                </div>
                <div style={{fontSize:'0.78rem',color:'var(--text3)'}}>Нэр бичсэн сурагчид</div>
              </div>

              {joins.length > 0 && (
                <div style={{maxWidth:360,margin:'0 auto 14px',textAlign:'left',border:'1px solid var(--border)',borderRadius:12,overflow:'hidden'}}>
                  {joins.slice(0, 8).map((j, idx) => (
                    <div key={idx} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'8px 12px',background: idx % 2 ? 'var(--surface2)' : 'white'}}>
                      <div style={{fontWeight:700,fontSize:'0.85rem',color:'var(--text)'}}>{j.name}</div>
                    </div>
                  ))}
                </div>
              )}

              <div style={{fontSize:'0.82rem',color:'var(--text2)',marginTop:8}}>
                ❓ {(() => { const vs = exam?.versions; if (vs && typeof vs === 'object') { const v = Object.values(vs); return v.length > 0 ? (v[0]||[]).length : 0; } return (normalizeVariants(exam)[0]?.questions||[]).length; })()} асуулт &nbsp;·&nbsp; ⏱ {exam.duration} мин
                {variantLabels.length > 1 && <span style={{marginLeft:8,background:'var(--violet-light)',color:'var(--violet)',borderRadius:12,padding:'2px 8px',fontSize:'0.75rem',fontWeight:700}}>🎯 хувилбар тэнцүү</span>}
              </div>
              {variantLabels.length > 1 && (
                <div className="variant-stats-strip" style={{marginTop:12,justifyContent:'center'}}>
                  {variantLabels.map(vl => (
                    <span key={vl} className="variant-stat-chip">
                      <span className="chip-label">Хувилбар {vl}</span>
                      <strong>{variantCounts?.[vl] ?? 0}</strong>
                    </span>
                  ))}
                </div>
              )}
            </div>
            <div className="modal-foot">
              <button className="btn btn-primary" onClick={onClose}>Хаах</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function QRRoomLoader({ roomID, onLoaded, onBack }) {
  const [err, setErr] = useState('');
  const onLoadedRef = useRef(onLoaded);
  onLoadedRef.current = onLoaded;

  useEffect(() => {
    let cancelled = false;
    setErr('');
    (async () => {
      try {
        const room = await fetchExamRoomByCode(roomID);
        if (cancelled) return;
        onLoadedRef.current?.(room);
      } catch (e) {
        if (!cancelled) setErr(e?.message || 'Алдаа');
      }
    })();
    return () => { cancelled = true; };
  }, [roomID]);

  return (
    <div className="modal-overlay">
      <div className="modal" style={{maxWidth:420}}>
        <div className="modal-head">
          <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>⏳ Room ачаалж байна...</div>
        </div>
        <div className="modal-body">
          {err ? (
            <div style={{color:'var(--red)',fontWeight:700}}>⚠ {err}</div>
          ) : (
            <div style={{color:'var(--text2)'}}>Шалгалтын мэдээллийг авч байна</div>
          )}
        </div>
        <div className="modal-foot">
          <button className="btn btn-outline" onClick={onBack}>← Буцах</button>
        </div>
      </div>
    </div>
  );
}

// ─── CHEAT DETAIL MODAL ───────────────────────────────────────────────────────
function CheatDetailModal({ sub, onClose }) {
  const log = sub.cheatLog || [];
  const typeLabels = {
    TAB_SWITCH: { label: 'Таб сэлгэсэн', icon: '🔀' },
    WINDOW_BLUR: { label: 'Цонхноос гарсан', icon: '👁' },
    COPY: { label: 'Текст хуулсан', icon: '📋' },
    RIGHT_CLICK: { label: 'Баруун товч', icon: '🖱' },
    TRANSLATE: { label: 'Translate ашигласан', icon: '🌐' },
    SPLIT_SCREEN: { label: 'Дэлгэц хуваасан', icon: '🪟' },
    FORCE_STOP: { label: 'Багш зогсоосон', icon: '⏹' },
  };
  const counts = log.reduce((acc, e) => { acc[e.type] = (acc[e.type]||0)+1; return acc; }, {});
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{maxWidth:520}}>
        <div className="modal-head">
          <div>
            <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>🔍 Чит тайлан — {sub.studentName}</div>
            <div style={{fontSize:'0.8rem',color:'var(--text2)'}}>{sub.studentClass} · {log.length} удаа сэжигтэй үйлдэл</div>
          </div>
        </div>
        <div className="modal-body" style={{padding:'16px 24px'}}>
          {log.length === 0 ? (
            <div style={{textAlign:'center',padding:'24px',color:'var(--green)'}}>
              <div style={{fontSize:'2rem',marginBottom:8}}>✅</div>
              <div style={{fontWeight:700}}>Чит илрээгүй</div>
            </div>
          ) : (
            <>
              <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:16}}>
                {Object.entries(counts).map(([type, cnt]) => {
                  const t = typeLabels[type] || {label:type,icon:'⚠'};
                  return (
                    <span key={type} style={{background:'var(--red-light)',color:'var(--red)',padding:'4px 12px',borderRadius:20,fontSize:'0.78rem',fontWeight:700}}>
                      {t.icon} {t.label} × {cnt}
                    </span>
                  );
                })}
              </div>
              <div className="cheat-detail-modal">
                {log.map((e, i) => {
                  const t = typeLabels[e.type] || {label:e.type,icon:'⚠'};
                  return (
                    <div className="cheat-event" key={i}>
                      <span style={{fontSize:'1rem'}}>{t.icon}</span>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:600,color:'var(--text)'}}>{t.label}</div>
                        <div style={{color:'var(--text3)',fontSize:'0.75rem'}}>{new Date(e.time).toLocaleTimeString('mn-MN')}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
        <div className="modal-foot">
          <button className="btn btn-primary" onClick={onClose}>Хаах</button>
        </div>
      </div>
    </div>
  );
}


function ExamResultsView({ exam, allSubs, onBack, onCheatClick, cheatSub, onCheatClose, apiKey, onApiKey }) {
  const classOptions = useMemo(
    () => [...new Set(allSubs.map(s => (s.studentClass || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'mn')),
    [allSubs]
  );
  const [classFilter, setClassFilter] = useState('all');
  const [showClassMenu, setShowClassMenu] = useState(false);
  const [aiAnalysis, setAiAnalysis] = useState(null);
  const [aiBusy, setAiBusy] = useState(false);
  const [aiErr, setAiErr] = useState('');
  const [verifiedSubs, setVerifiedSubs] = useState(null);
  const [showApiModal, setShowApiModal] = useState(false);
  const [localApiKey, setLocalApiKey] = useState(apiKey || '');
  const effectiveKey = localApiKey || apiKey || '';

  useEffect(() => { setLocalApiKey(apiKey || ''); }, [apiKey]);

  useEffect(() => {
    if (classOptions.length === 0) setClassFilter('all');
    else if (classFilter === 'all' || !classOptions.includes(classFilter)) {
      setClassFilter(classOptions[0]);
    }
  }, [classOptions.join('|')]);

  const subs = useMemo(() => {
    if (classFilter === 'all') return allSubs;
    return allSubs.filter(s => (s.studentClass || '').trim() === classFilter);
  }, [allSubs, classFilter]);

  const runAiAnalysis = async (keyOverride) => {
    const key = keyOverride !== undefined ? keyOverride : effectiveKey;
    const list = verifiedSubs || subs;
    if (!list.length) { setAiErr('Шинжлэх дүн алга'); return; }
    if (!key) { setShowApiModal(true); return; }
    setAiBusy(true); setAiErr('');
    try {
      const result = await analyzeExamWithAI({ apiKey: key, exam, subs: list });
      setAiAnalysis(result);
    } catch (e) {
      setAiErr(e?.message || 'Анализ алдаа');
    } finally {
      setAiBusy(false);
    }
  };

  // Teacher regrade from answerKeys (source of truth — blocks forged scores)
  useEffect(() => {
    let alive = true;
    (async () => {
      const db = getDb();
      if (!db || !exam?.id || !subs.length) { setVerifiedSubs(null); return; }
      try {
        const snap = await roomRef(db, exam.id).child('answerKeys').once('value');
        const keys = snap.val();
        if (!keys) { setVerifiedSubs(null); return; }
        const next = subs.map(s => {
          const label = s.variantLabel || s.studentVersion || 'A';
          const keyList = keys[label];
          if (!Array.isArray(keyList) || !window.SESecurity) return s;
          return SESecurity.regradeSubmission(s, keyList);
        });
        if (alive) setVerifiedSubs(next);

        // Persist verified scores back (owner write)
        const updates = {};
        next.forEach(s => {
          if (!s.id || !s.verified) return;
          updates[`activeRooms/${exam.id}/submissions/${s.id}/score`] = s.score;
          updates[`activeRooms/${exam.id}/submissions/${s.id}/correctCount`] = s.correctCount;
          updates[`activeRooms/${exam.id}/submissions/${s.id}/totalCount`] = s.totalCount;
          updates[`activeRooms/${exam.id}/submissions/${s.id}/verified`] = true;
          updates[`activeRooms/${exam.id}/submissions/${s.id}/gradedBy`] = s.gradedBy || 'teacher-regrade';
        });
        if (Object.keys(updates).length) {
          try { await db.ref().update(updates); } catch {}
        }
      } catch (e) {
        console.warn('regrade', e);
      }
    })();
    return () => { alive = false; };
  }, [exam?.id, subs.length, classFilter]);

  const displaySubs = verifiedSubs || subs;

  // Auto-run heuristic (no API) once when subs load
  useEffect(() => {
    if (!displaySubs.length || aiAnalysis) return;
    analyzeExamWithAI({ apiKey: null, exam, subs: displaySubs }).then(setAiAnalysis).catch(() => {});
  }, [displaySubs.length, exam?.id]);

  const avg = displaySubs.length ? Math.round(displaySubs.reduce((a, s) => a + s.score, 0) / displaySubs.length) : 0;
  const passed = displaySubs.filter(s => s.score >= exam.passingScore).length;

  const variantGroups = {};
  displaySubs.forEach(s => {
    const vl = s.variantLabel || s.studentVersion || 'A';
    if (!variantGroups[vl]) variantGroups[vl] = [];
    variantGroups[vl].push(s);
  });
  const variantLabels = Object.keys(variantGroups).sort();

  const safeTitle = (exam.title || 'results').replace(/[\\/:*?"<>|]+/g, ' ').trim();

  return (
    <div>
      {showApiModal && (
        <SettingsModal
          apiKey={effectiveKey}
          title="🔑 Groq API түлхүүр"
          onSave={(k) => {
            setLocalApiKey(k);
            onApiKey?.(k);
            runAiAnalysis(k);
          }}
          onClose={() => setShowApiModal(false)}
        />
      )}
      <div className="page-header">
        <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
          <button className="btn btn-ghost btn-sm" onClick={onBack}>← Буцах</button>
          <div>
            <h2 className="page-title">{exam.title} — Үр дүн</h2>
            <div className="page-sub">
              {exam.subject} · {classFilter === 'all' ? allSubs.length : subs.length} сурагч
              {classFilter !== 'all' && <span> · <strong>{classFilter}</strong> анги</span>}
            </div>
          </div>
          <div style={{marginLeft:'auto',display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
            {classOptions.length > 0 && (
              <div style={{position:'relative'}}>
                <button className="btn btn-outline btn-sm" onClick={() => setShowClassMenu(v => !v)}>
                  Ангиуд ▾ {classFilter !== 'all' ? `(${classFilter})` : ''}
                </button>
                {showClassMenu && (
                  <div style={{
                    position:'absolute',right:0,top:'100%',marginTop:6,minWidth:160,
                    background:'white',border:'1px solid var(--border)',borderRadius:10,
                    boxShadow:'0 8px 24px rgba(0,0,0,.12)',zIndex:50,overflow:'hidden'
                  }}>
                    {classOptions.map(cls => (
                      <button
                        key={cls}
                        type="button"
                        className="btn btn-ghost btn-sm"
                        style={{width:'100%',justifyContent:'flex-start',borderRadius:0,background: classFilter === cls ? 'var(--violet-light)' : 'transparent'}}
                        onClick={() => { setClassFilter(cls); setShowClassMenu(false); }}
                      >
                        {cls} анги ({allSubs.filter(s => (s.studentClass || '').trim() === cls).length})
                      </button>
                    ))}
                    <button
                      type="button"
                      className="btn btn-ghost btn-sm"
                      style={{width:'100%',justifyContent:'flex-start',borderRadius:0,borderTop:'1px solid var(--border)'}}
                      onClick={() => { setClassFilter('all'); setShowClassMenu(false); }}
                    >
                      Бүх анги ({allSubs.length})
                    </button>
                  </div>
                )}
              </div>
            )}
            <button
              className="btn btn-outline btn-sm"
              onClick={() => downloadExcelByClass(`SmartEXAM_${safeTitle}`, allSubs)}
            >
              ⬇ Excel татах
            </button>
          </div>
        </div>
      </div>
      <div className="container">
        <div className="stats-strip">
          <div className="stat-card"><div className="stat-val">{displaySubs.length}</div><div className="stat-lbl">Нийт оролцсон</div></div>
          <div className="stat-card"><div className="stat-val" style={{color:'var(--green)'}}>{passed}</div><div className="stat-lbl">Тэнцсэн</div></div>
          <div className="stat-card"><div className="stat-val" style={{color:'var(--red)'}}>{displaySubs.length - passed}</div><div className="stat-lbl">Тэнцээгүй</div></div>
          <div className="stat-card"><div className="stat-val">{avg}%</div><div className="stat-lbl">Дундаж оноо</div></div>
        </div>

        {(displaySubs.length > 0 || aiAnalysis) && (
          <div className="ai-analysis-card">
            <div className="ai-analysis-title">
              🧠 AI Анализ — Сул талыг олж харах
              <span className="badge badge-green" style={{fontWeight:600,fontSize:'0.7rem'}}>🔒 verified dүн</span>
              <button className="btn btn-violet btn-sm" style={{marginLeft:'auto'}} onClick={() => runAiAnalysis()} disabled={aiBusy || !displaySubs.length}>
                {aiBusy ? '⏳ ...' : '✨ AI зөвлөмж шинэчлэх'}
              </button>
            </div>
            {aiErr && <div className="form-error" style={{marginBottom:10}}>⚠ {aiErr}</div>}
            {aiAnalysis && (
              <>
                <div className="ai-advice-box">
                  <strong style={{color:'var(--violet)'}}>Зөвлөмж: </strong>
                  {aiAnalysis.advice}
                </div>
                {aiAnalysis.bars?.length > 0 && (
                  <div>
                    <div style={{fontSize:'0.8rem',fontWeight:700,color:'var(--text2)',marginBottom:8}}>Ангийн дундаж гүйцэтгэл (сэдвээр)</div>
                    <div className="bar-chart">
                      {aiAnalysis.bars.slice(0, 6).map((b, i) => (
                        <div className="bar-col" key={i}>
                          <div className="bar-pct">{b.pct}%</div>
                          <div className={'bar-fill' + (b.wrongPct >= 50 ? ' weak' : '')}
                            style={{ height: Math.max(8, b.pct) + '%' }} />
                          <div className="bar-lbl">{(b.topic || '').slice(0, 18)}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}
            {!aiAnalysis && !aiBusy && (
              <div style={{fontSize:'0.85rem',color:'var(--text2)'}}>Дүн ирэхэд автоматаар сул сэдвийг тооцно. AI зөвлөмж авахдаа Groq API түлхүүр асууна.</div>
            )}
          </div>
        )}

        {variantLabels.length > 1 && (
          <div className="card" style={{marginBottom:18}}>
            <div className="card-header"><div className="card-title">🎯 Хувилбараар дүн шинжилгээ</div></div>
            <div className="card-body" style={{padding:'16px 20px'}}>
              <div className="variant-stats-strip">
                {variantLabels.map(vl => {
                  const vs = variantGroups[vl] || [];
                  const vAvg = vs.length ? Math.round(vs.reduce((a,s)=>a+s.score,0)/vs.length) : 0;
                  const vPassed = vs.filter(s=>s.score>=exam.passingScore).length;
                  return (
                    <div key={vl} style={{flex:1,minWidth:130,background:'white',border:'1.5px solid #ddd6fe',borderRadius:12,padding:'14px 16px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                        <div style={{width:32,height:32,borderRadius:8,background:'var(--violet)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Outfit',fontWeight:900,fontSize:'1rem'}}>{vl}</div>
                        <div style={{fontFamily:'Outfit',fontWeight:700,fontSize:'0.9rem'}}>Хувилбар {vl}</div>
                      </div>
                      <div style={{fontSize:'0.8rem',color:'var(--text2)',lineHeight:1.8}}>
                        <div>👥 <strong style={{color:'var(--text)'}}>{vs.length}</strong> сурагч</div>
                        <div>📊 Дундаж: <strong style={{color: vAvg>=exam.passingScore?'var(--green)':'var(--red)'}}>{vAvg}%</strong></div>
                        <div>✅ Тэнцсэн: <strong style={{color:'var(--green)'}}>{vPassed}</strong> / <strong style={{color:'var(--red)'}}>{vs.length-vPassed}</strong></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {displaySubs.length === 0 ? (
          <div className="card"><div className="card-body">
            <div className="empty-state">
              <div className="empty-icon">📭</div>
              <div className="empty-title">Энэ ангид хариулт алга</div>
              <div className="empty-sub">Өөр анги сонгох эсвэл сурагчид QR уншуулна уу</div>
            </div>
          </div></div>
        ) : (
          <div className="card">
            <div className="card-header"><div className="card-title">📋 Сурагчдын хариулт {verifiedSubs ? '· ✅ дахин дүгнэгдсэн' : ''}</div></div>
            <div style={{overflowX:'auto'}}>
              <table className="sub-table">
                <thead>
                  <tr>
                    <th>#</th><th>Нэр</th><th>Анги</th><th>Хувилбар</th><th>Дүн</th><th>Хугацаа</th><th>Cheat</th><th>Огноо</th>
                  </tr>
                </thead>
                <tbody>
                  {displaySubs.slice().sort((a,b) => b.score - a.score).map((s, i) => {
                    const cheatCnt = (s.cheatLog||[]).length;
                    const pillCls = cheatCnt === 0 ? 'cheat-pill-0' : cheatCnt <= 2 ? 'cheat-pill-warn' : 'cheat-pill-danger';
                    const took = typeof s.timeSpentSec === 'number' ? fmtDur(s.timeSpentSec) : '—';
                    const vlabel = s.variantLabel || s.studentVersion || 'A';
                    return (
                      <tr key={s.id} className={cheatCnt > 0 ? 'cheat-row-bad' : ''}>
                        <td style={{color:'var(--text3)',fontWeight:600}}>{i+1}</td>
                        <td><strong>{s.studentName}</strong></td>
                        <td>{s.studentClass || '—'}</td>
                        <td><span className="badge badge-violet" style={{fontFamily:'monospace',fontWeight:800,fontSize:'0.85rem'}}>{vlabel}</span></td>
                        <td>
                          <span style={{fontFamily:'Outfit',fontWeight:700,fontSize:'1rem',color: s.score >= exam.passingScore ? 'var(--green)' : 'var(--red)'}}>{s.score}%</span>
                          <div style={{color:'var(--text3)',fontSize:'0.75rem',marginTop:2}}>
                            {s.correctCount}/{s.totalCount}
                            {' · '}
                            <span style={{fontWeight:700,color: s.score >= exam.passingScore ? 'var(--green)' : 'var(--red)'}}>
                              {s.score >= exam.passingScore ? 'Тэнцсэн' : 'Тэнцээгүй'}
                            </span>
                          </div>
                        </td>
                        <td style={{fontFamily:'monospace',fontSize:'0.9rem',color:'var(--text2)'}}>{took}</td>
                        <td>
                          <span className={`cheat-pill ${pillCls}`} onClick={() => onCheatClick(s)}>
                            {cheatCnt === 0 ? '✓ Цэвэр' : `⚠ ${cheatCnt} удаа`}
                          </span>
                        </td>
                        <td style={{color:'var(--text3)',fontSize:'0.8rem'}}>{new Date(s.submittedAt).toLocaleString('mn-MN')}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>
      {cheatSub && <CheatDetailModal sub={cheatSub} onClose={onCheatClose} />}
    </div>
  );
}

function TeacherDashboard({ exams, submissions, apiKey, teacherName, onCreateExam, onApiKey, onDeleteExam, onOpenOMR, onLogout }) {
  const [view, setView] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [apiKeyState, setApiKeyState] = useState(apiKey);
  const [qrExam, setQrExam] = useState(null);
  const [cheatSub, setCheatSub] = useState(null);
  const [delExam, setDelExam] = useState(null);
  const [stopExam, setStopExam] = useState(null);
  const [rtdbSubs, setRtdbSubs] = useState(null);
  const [zipGradePick, setZipGradePick] = useState(false);
  const [, forceUpdate] = useState(0);

  const openZipGrade = () => {
    if (!exams.length) {
      alert('Эхлээд дор хаяж нэг тест үүсгэнэ үү. Дараа нь ZipGrade-ээр цаас уншина.');
      return;
    }
    if (exams.length === 1) {
      onOpenOMR?.(exams[0]);
      return;
    }
    setZipGradePick(true);
  };

  // Ensure clientPack exists for fast student/QR load
  useEffect(() => {
    const db = getDb();
    const teacher = ensureTeacherAuth();
    if (!db || !teacher || !exams?.length) return;
    exams.forEach(exam => {
      if (!exam?.id) return;
      const versions = {};
      normalizeVariants(exam).forEach(v => {
        const qs = (v.questions || []).filter(q => (q.text || '').trim());
        if (qs.length) versions[v.label || 'A'] = packQuestions(qs);
      });
      if (!Object.keys(versions).length) return;
      roomRef(db, exam.id).child('clientPack')
        .set(buildClientPack({ ...exam, ownerUid: teacher.uid, id: exam.id }, versions))
        .catch(() => {});
    });
  }, [exams]);

  // Realtime submissions across devices (optional)
  useEffect(() => {
    if (view?.type !== 'results' || !view?.exam?.id) { setRtdbSubs(null); return; }
    const db = getDb();
    if (!db) { setRtdbSubs(null); return; }
    try {
      const ref = roomRef(db, view.exam.id).child('submissions');
      const handler = ref.on('value', (snap) => {
        const val = snap.val() || {};
        const list = Object.values(val).filter(Boolean);
        setRtdbSubs(list);
      });
      return () => { try { ref.off('value', handler); } catch {} };
    } catch {
      setRtdbSubs(null);
    }
  }, [view?.type, view?.exam?.id]);

  if (view?.type === 'results') {
    const allSubs = Array.isArray(rtdbSubs) ? rtdbSubs : submissions.filter(s => s.examId === view.exam.id);
    return (
      <ExamResultsView
        exam={view.exam}
        allSubs={allSubs}
        apiKey={apiKeyState || apiKey}
        onApiKey={k => { setApiKeyState(k); onApiKey(k); try { sessionStorage.setItem('se_apikey', k); localStorage.removeItem('se_apikey'); } catch {} }}
        onBack={() => setView(null)}
        onCheatClick={setCheatSub}
        cheatSub={cheatSub}
        onCheatClose={() => setCheatSub(null)}
      />
    );
  }

  return (
    <div>
      {qrExam && <QRModal exam={qrExam} onClose={() => setQrExam(null)} />}
      {cheatSub && <CheatDetailModal sub={cheatSub} onClose={() => setCheatSub(null)} />}
      {delExam && (
        <ConfirmDeleteModal
          title={delExam.title}
          onCancel={() => setDelExam(null)}
          onConfirm={() => { onDeleteExam?.(delExam); setDelExam(null); }}
        />
      )}
      {stopExam && (
        <ConfirmStopModal
          title={stopExam.title}
          onCancel={() => setStopExam(null)}
          onConfirm={() => {
            const db = getDb();
            if (db) {
              try {
                roomRef(db, stopExam.id).update({
                  stopped: true,
                  stoppedAt: firebase.database.ServerValue.TIMESTAMP
                });
              } catch {}
            }
            setStopExam(null);
          }}
        />
      )}
      {showSettings && (
        <SettingsModal
          apiKey={apiKeyState}
          onSave={k => { setApiKeyState(k); onApiKey(k); try { sessionStorage.setItem('se_apikey', k); localStorage.removeItem('se_apikey'); } catch {} }}
          onClose={() => setShowSettings(false)}
        />
      )}
      {zipGradePick && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setZipGradePick(false)}>
          <div className="modal" style={{ maxWidth: 420 }}>
            <div className="modal-head">
              <div style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: '1.1rem' }}>📷 ZipGrade — Тест сонгох</div>
              <div style={{ fontSize: '0.8rem', color: 'var(--text2)', marginTop: 4 }}>Цаасан хариулт унших тестээ сонгоно уу</div>
            </div>
            <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {exams.map(ex => (
                <button
                  key={ex.id}
                  type="button"
                  className="btn btn-outline"
                  style={{ justifyContent: 'flex-start', textAlign: 'left' }}
                  onClick={() => { setZipGradePick(false); onOpenOMR?.(ex); }}
                >
                  <strong>{ex.title}</strong>
                  <span style={{ marginLeft: 8, fontSize: '0.8rem', color: 'var(--text2)' }}>📚 {ex.subject}</span>
                </button>
              ))}
            </div>
            <div className="modal-foot">
              <button className="btn btn-ghost" onClick={() => setZipGradePick(false)}>Болих</button>
            </div>
          </div>
        </div>
      )}
      <div className="page-header">
        <div className="container-lg" style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
          <div>
            <h2 className="page-title">👋 Сайн байна уу, {teacherName}</h2>
            <div className="page-sub">Таны шалгалтын хяналтын самбар</div>
          </div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <button className="btn btn-outline btn-sm" onClick={() => setShowSettings(true)}>⚙ API тохиргоо</button>
            <button className="btn btn-green btn-sm" onClick={openZipGrade} title="Цаасан хариулт сканер — OpenCV">📷 ZipGrade</button>
            <button className="btn btn-primary btn-sm" onClick={onCreateExam}>+ Шинэ тест</button>
            {onLogout && <button className="btn btn-ghost btn-sm" onClick={onLogout} title="Гарах">🚪 Гарах</button>}
          </div>
        </div>
      </div>

      <div className="container-lg">
        <div className="stats-strip">
          <div className="stat-card"><div className="stat-val">{exams.length}</div><div className="stat-lbl">Нийт тест</div></div>
          <div className="stat-card"><div className="stat-val">{submissions.length}</div><div className="stat-lbl">Нийт дүн</div></div>
          <div className="stat-card">
            <div className="stat-val" style={{color:'var(--green)'}}>
              {submissions.length ? Math.round(submissions.reduce((a,s) => a+s.score, 0) / submissions.length) : 0}%
            </div>
            <div className="stat-lbl">Нийт дундаж</div>
          </div>
        </div>

        {exams.length === 0 ? (
          <div className="card">
            <div className="card-body">
              <div className="empty-state">
                <div className="empty-icon">📋</div>
                <div className="empty-title">Тест байхгүй байна</div>
                <div className="empty-sub">Шинэ тест үүсгэж, сурагчдад нийтлэнэ үү</div>
                <button className="btn btn-primary" onClick={onCreateExam}>+ Шинэ тест үүсгэх</button>
              </div>
            </div>
          </div>
        ) : (
          <div className="exam-grid">
            {exams.map(exam => {
              const subs = submissions.filter(s => s.examId === exam.id);
              const avg = subs.length ? Math.round(subs.reduce((a,s) => a+s.score, 0) / subs.length) : null;
              const vars = normalizeVariants(exam);
              const vCount = vars.length;
              const qCount = (vars[0]?.questions || []).length;
              return (
                <div className="exam-card" key={exam.id} onClick={() => setQrExam(exam)} style={{cursor:'pointer'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                    <div className="exam-card-title">{exam.title}</div>
                    <span className="badge badge-green" style={{flexShrink:0,marginLeft:8}}>✓ Нийтлэгдсэн</span>
                  </div>
                  <div className="exam-card-meta">
                    <span>📚 {exam.subject}</span>
                    <span>❓ {qCount} асуулт</span>
                    <span>⏱ {exam.duration} мин</span>
                    <span>🎯 <strong style={{color:'var(--violet)'}}>{vCount} хувилбар</strong> ({vars.map(v=>v.label||'A').join(', ')})</span>
                  </div>
                  <div style={{display:'flex',gap:12,fontSize:'0.82rem',color:'var(--text2)',marginBottom:10}}>
                    <span>👥 {subs.length} оролцсон</span>
                    {avg !== null && <span>📊 Дундаж: <strong style={{color:'var(--text)'}}>{avg}%</strong></span>}
                  </div>
                  <div style={{background:'var(--primary-light)',borderRadius:8,padding:'10px 12px',marginBottom:12,fontSize:'0.78rem',color:'var(--text2)',border:'1px solid #c7d2fe'}}>
                    <div style={{fontWeight:700,color:'var(--primary)',marginBottom:6}}>🔑 Сурагчдын тестийн код</div>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                      <strong style={{fontFamily:'monospace',color:'var(--text)',fontSize:'0.82rem',wordBreak:'break-all',flex:1}}>{exam.id}</strong>
                      <button
                        type="button"
                        className="btn btn-outline btn-sm"
                        onClick={(e) => {
                          e.stopPropagation();
                          navigator.clipboard?.writeText(exam.id).then(() => alert('Код хуулагдлаа! Сурагчдад илгээнэ үү.')).catch(() => {});
                        }}
                      >📋 Хуулах</button>
                    </div>
                    <div style={{marginTop:6,fontSize:'0.72rem',color:'var(--text3)'}}>Сурагч: Нэр + Анги + энэ код → шалгалт</div>
                  </div>
                  <div className="exam-card-actions">
                    <button className="btn btn-outline btn-sm" onClick={(e) => { e.stopPropagation(); setView({type:'results', exam}); }}>📊 Үр дүн</button>
                    <button className="btn btn-violet btn-sm" onClick={(e) => { e.stopPropagation(); setQrExam(exam); }}>📱 QR код</button>
                  <button className="btn btn-outline btn-sm" onClick={(e) => { e.stopPropagation(); setStopExam(exam); }}>⏹ Зогсоох</button>
                    <button className="btn btn-red btn-sm" onClick={(e) => { e.stopPropagation(); setDelExam(exam); }}>🗑 Устгах</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── OMR ANSWER SHEET (PRINT) ─────────────────────────────────────────────────
function OMRAnswerSheet({ examTitle, examId, omrMode = 'mcq', subject = '' }) {
  const mode = omrMode === 'tf' ? 'tf' : omrMode === 'grid' ? 'grid' : 'mcq';
  const profile = getSubjectProfile(subject);
  const modeLabel = mode === 'tf' ? 'Зөв/Буруу' : mode === 'grid' ? 'Grid-in (0–9)' : 'A–D сонголт';

  return (
    <div className="omr-print-area">
      <div className={'omr-sheet fmt-' + mode}>
        <div className="omr-marker omr-marker-tl" />
        <div className="omr-marker omr-marker-tr" />
        <div className="omr-marker omr-marker-bl" />
        <div className="omr-marker omr-marker-br" />
        <div className="omr-sheet-head">
          <h1>SmartEXAM — Хариултын хуудас</h1>
          <div style={{ fontSize: '11pt' }}>{examTitle || 'Шалгалт'}</div>
          {(subject || profile) && <div style={{ fontSize: '10pt' }}>{profile?.icon || ''} {subject || profile?.name}</div>}
          <div className="omr-format-badge">Формат: {modeLabel}</div>
          <div className="omr-sheet-meta">
            <span>Нэр: <span className="omr-meta-line" /></span>
            <span>Анги: <span className="omr-meta-line" style={{ minWidth: 80 }} /></span>

                <th>Зуун</th><th>Аравт</th><th>Нэгж</th>

              {Array.from({ length: OMR_Q_COUNT }, (_, i) => (

                    <td key={col}>

            <thead>
              <tr>
                <th className="omr-q-num">№</th>
                <th><span className="omr-tf-label">А. ЗӨВ / ҮНЭН</span></th>
                <th><span className="omr-tf-label">В. БУРУУ / ХУДАЛ</span></th>
              </tr>
            </thead>
            <tbody>
              {Array.from({ length: OMR_Q_COUNT }, (_, i) => (

              {Array.from({ length: OMR_Q_COUNT }, (_, i) => (
                <tr key={i}>
                  <td className="omr-q-num">{i + 1}</td>
                  {OMR_OPTS.map(o => (
                    <td key={o} className="omr-bubble-cell"><span className="omr-bubble" /></td>
